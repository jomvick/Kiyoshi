name: Release Kiyoshi

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & RPM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update || (sleep 5 && sudo apt-get update)
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libjsoncpp-dev \
            libsecret-1-dev libstdc++-12-dev rpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Code Generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Linux Release
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Build RPM
        run: |
          chmod +x build_rpm.sh
          ./build_rpm.sh

      - name: Rename RPM to stable name
        run: |
          APP_VERSION=$(cat VERSION 2>/dev/null | tr -d '\r\n' || echo '1.0.2')
          RPM_FILE=$(find build -name '*.rpm' | head -1)
          if [ -n "$RPM_FILE" ]; then
            cp "$RPM_FILE" "build/kiyoshi-${APP_VERSION}-1.x86_64.rpm" || true
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            Kiyoshi-*.AppImage
            build/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows (ZIP & Installer .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Code Generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Windows Release
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package Windows ZIP
        shell: powershell
        run: |
          $version = Get-Content VERSION -ErrorAction SilentlyContinue
          if (!$version) { $version = "1.0.2" }
          $version = $version.Trim()
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Kiyoshi-$version-windows-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer (.exe)
        shell: powershell
        run: |
          $version = Get-Content VERSION -ErrorAction SilentlyContinue
          if (!$version) { $version = "1.0.2" }
          $version = $version.Trim()
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" packaging\windows\kiyoshi_setup.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc /DMyAppVersion="$version" packaging\windows\kiyoshi_setup.iss
          } else {
            Write-Host "Inno Setup compiler not found"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            Kiyoshi-*-windows-x64.zip
            Kiyoshi-*-Setup.exe
          if-no-files-found: ignore

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Code Generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter macOS Release
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Package macOS DMG
        run: |
          APP_VERSION=$(cat VERSION 2>/dev/null | tr -d '\r\n' || echo '1.0.2')
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            hdiutil create -volname "Kiyoshi" -srcfolder "$APP_PATH" -ov -format UDZO "Kiyoshi-$APP_VERSION-macos.dmg"
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: Kiyoshi-*-macos.dmg
          if-no-files-found: ignore

  publish:
    name: Publish Github Release
    needs: [build-linux, build-windows, build-macos]
    if: always() && !cancelled() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -la dist/ || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Kiyoshi ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.rpm
            dist/*.zip
            dist/*.exe
            dist/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
